[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "judge-calibrate"
version = "0.1.0"
description = "Measure and correct bias in LLM-as-judge scoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
judge-calibrate = "judge_calibrate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/judge_calibrate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
